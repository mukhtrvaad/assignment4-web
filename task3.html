<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Form Validation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <nav class="navbar">
        <a href="task0.html">Task 0</a>
        <a href="index.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a href="task4.html">Task 4</a>
    </nav>

    <div class="container">
        <h1>Send a Message</h1>

        <form class="was-validated">

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" name="name"
                       class="form-control"
                       maxlength="50" required>

                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Name is required.</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email"
                       class="form-control" required>

                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Enter a valid email.</div>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" name="message"
                          class="form-control"
                          rows="4" maxlength="500" required></textarea>

                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Message is required.</div>
            </div>

            <button type="submit" class="btn btn-dark">Submit</button>

        </form>
    </div>

</body>
</html>
